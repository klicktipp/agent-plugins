# Publishes docs/ as the plugin's documentation site:
#   https://klicktipp.github.io/agent-plugins/
#
# The plugin directories require a documentation URL that resolves on the day of
# publication, and both manifests point their `homepage` here. Enable Pages once
# in the repository settings, with "GitHub Actions" as the source.

name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a queued run supersedes a waiting one, but never interrupts a deploy in flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
